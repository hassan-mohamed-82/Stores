spring.application.name=Stores
server.port=8080
spring.datasource.username=xpark
spring.datasource.password=123456
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/Stores?sslmode=disable

# ---- JPA — validate only, Flyway manages schema ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.generate-ddl=false

# ---- Flyway (fresh DB — run all migrations) ----
spring.flyway.baseline-on-migrate=false

# ---- Health Endpoint (full details in dev) ----
management.endpoint.health.show-details=always
